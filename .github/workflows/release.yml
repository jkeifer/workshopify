name: Build and release

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from tags, so it needs full history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build package
        run: uv build
      - name: Verify built version matches the release tag
        if: startsWith(github.ref, 'refs/tags')
        # A version once uploaded to PyPI can never be reused. If this
        # checkout ever lost fetch-depth: 0, hatch-vcs could not describe the
        # tag and would silently fall back to version 0.0.0, and this
        # workflow would publish that fallback with a green checkmark. Refuse
        # to proceed unless the built artifact's version is exactly the tag.
        run: |
          expected="${GITHUB_REF_NAME#v}"
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          if [ -z "$wheel" ]; then
            echo "No wheel found in dist/" >&2
            exit 1
          fi
          built="$(basename "$wheel" .whl | cut -d- -f2)"
          if [ "$built" != "$expected" ]; then
            echo "Version mismatch: tag expects '$expected', built artifact has '$built'" >&2
            exit 1
          fi
          echo "OK: built version '$built' matches tag '$GITHUB_REF_NAME'"
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags')
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          overwrite: true
          if-no-files-found: error

  release-package:
    if: github.event_name == 'release'
    needs: build-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/workshopify
    permissions:
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
      - name: Upload release
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
