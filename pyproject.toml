[project]
name = 'workshopify'
description = 'Skeleton and scaffolding for template-rendered, notebook-based workshop repositories'
readme = 'README.md'
authors = [
    {name = 'Jarrett Keifer', email = 'jkeifer0@gmail.com'},
]
license = 'Apache-2.0'
license-files = ['LICENSE']
requires-python = '>=3.14'
dependencies = [
    'cogapp>=3.5.1',
    'ipynb-scrubber>=0.5.0',
    'jupytext>=1.19.4',
    'tomlkit>=0.13.2',
]
dynamic = [
    'version',
]

[project.urls]
Repository = 'https://github.com/jkeifer/workshopify'

[project.scripts]
workshopify = 'workshopify.cli:main'

[build-system]
requires = [
    'hatchling>=1.27',
    'hatch-vcs>=0.4',
]
build-backend = 'hatchling.build'

[tool.hatch.version]
source = 'vcs'
# There are no tags yet, and hatch-vcs fails the build without a fallback.
fallback-version = '0.0.0'

[tool.hatch.build.hooks.vcs]
version-file = 'src/workshopify/__version__.py'

[tool.hatch.build.targets.wheel]
packages = ['src/workshopify']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    'B',
    'BLE',
    'C4',
    'C90',
    'COM',
    'DTZ',
    'E',
    'ERA',
    'F',
    'FA',
    'G',
    'I',
    'INP',
    'N',
    'NPY',
    'PT',
    'PTH',
    'RET',
    'RUF',
    'S',
    'SIM',
    'T20',
    'TID',
    'UP',
    'W',
]
ignore = [
    # COM812 (missing trailing comma) duplicates what the formatter already
    # does and fights it: a comma `ruff check --fix` adds becomes a magic
    # trailing comma that forces a layout the formatter would not choose.
    # Ruff warns about the conflict on every invocation. Dropping it is a
    # zero-diff change; COM818 and COM819 stay selected and still apply.
    'COM812',
]

[tool.ruff.lint.per-file-ignores]
# The CLI is the one place output happens: every other module returns what it
# computed and lets `cli.py` render it. This is the only sanctioned T201, and
# it is what makes that invariant enforced rather than merely documented.
'src/workshopify/cli.py' = ['T201']
# The two boundary modules, and the only places allowed to import what they
# wrap -- see flake8-tidy-imports.banned-api below. `proc.py` runs `git` and
# `uv` by name so the user's own (version, config, credential helpers) are the
# ones that run; resolving an absolute path would defeat that, and the
# argument lists are constructed by this package, never taken from user input.
'src/workshopify/fs.py' = ['TID251']
'src/workshopify/proc.py' = ['S603', 'S607', 'TID251']
# Tests assert (S101), shell out to `git` by name and reach for shutil to
# build and perturb fixture repos (S603/S607/TID251), and are an
# intentionally unpackaged directory (INP001).
'tests/**/*' = ['S101', 'S603', 'S607', 'TID251', 'INP001']

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# What `fs.py` and `proc.py` exist to state is only stated once if nothing
# else can reach past them. Both invariants below were documented and broken
# in the same tree before this: two hand-rolled `subprocess.run` wrappers that
# had already drifted, and two `shutil.copyfile` calls under a CLAUDE.md that
# says "never copyfile". Ruff cannot see a bare `Path.read_text`, so the
# diagnose-every-read half of `fs.py` stays convention.
'shutil'.msg = 'copy files through workshopify.fs, which sets the source mode'
'subprocess'.msg = 'run subprocesses through workshopify.proc, which diagnoses them'

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ty.environment]
python-version = '3.14'

[tool.pytest.ini_options]
testpaths = 'tests'
addopts = ['--cov=workshopify', '--cov-report=term-missing', '--cov-report=xml']
filterwarnings = ['error']

[tool.coverage.run]
# A statement that always runs and a branch that never takes one of its two
# ways read the same without this: line coverage cannot tell an `if` whose
# false arm nothing exercises from one both arms cover.
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
sort = 'Cover'

[dependency-groups]
dev = [
    'pre-commit-hooks>=6.0.0',
    'prek>=0.4.8',
    'pytest>=8.4.2',
    'pytest-cov>=7.0.0',
    'ruff>=0.16.2',
    'ty>=0.0.70',
]
